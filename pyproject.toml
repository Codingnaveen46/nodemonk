[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nodemonk"
version = "1.0.0"
description = "See everything. Ask anything. - any corpus (code, docs, data, media) into a persistent, queryable knowledge graph with community detection and an honest audit trail. No node caps, no query caps, fully local, zero dependencies."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "nodemonk labs" }]
keywords = ["knowledge-graph", "graphrag", "static-analysis", "community-detection", "ast", "code-search"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nodemonk = "nodemonk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["nodemonk", "nodemonk.extract"]
